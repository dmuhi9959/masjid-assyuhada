<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Kontrol Masjid</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0a0a2a; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
        input[type="text"], textarea, input[type="url"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        textarea { resize: vertical; min-height: 80px; }
        button { width: 100%; padding: 15px; background: #ffc107; color: black; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #e0a800; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .status { text-align: center; margin-top: 15px; font-weight: bold; color: #28a745; display: none; }
        hr { border: 0; border-top: 1px solid #eee; margin: 25px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚙️ PANEL KONTROL INFO MASJID</h2>
    
    <div class="form-group">
        <label>Nama Masjid</label>
        <input type="text" id="nama_masjid" placeholder="Masjid Al-Hikmah">
    </div>

    <div class="form-group">
        <label>Link Foto Wallpaper (Copas link dari Google/Browser)</label>
        <input type="url" id="background_url" placeholder="https://example.com/foto-masjid.jpg">
    </div>

    <div class="form-group">
        <label>Teks Berjalan (Running Text)</label>
        <textarea id="running_text" placeholder="Selamat datang di masjid..."></textarea>
    </div>

    <button onclick="simpanUtama()">SIMPAN PERUBAHAN</button>
    <div class="status" id="status-utama">✅ Berhasil disimpan!</div>

    <hr>

    <h2>🕌 JADWAL SHOLAT & IMAM</h2>
    <div class="grid-2">
        <div class="form-group"><label>Subuh</label><input type="text" id="subuh" placeholder="04:30"></div>
        <div class="form-group"><label>Imam Subuh</label><input type="text" id="imam_subuh" placeholder="Ustadz..."></div>
        
        <div class="form-group"><label>Dzuhur</label><input type="text" id="dzuhur" placeholder="12:00"></div>
        <div class="form-group"><label>Imam Dzuhur</label><input type="text" id="imam_dzuhur" placeholder="Ustadz..."></div>

        <div class="form-group"><label>Ashar</label><input type="text" id="ashar" placeholder="15:15"></div>
        <div class="form-group"><label>Imam Ashar</label><input type="text" id="imam_ashar" placeholder="Ustadz..."></div>

        <div class="form-group"><label>Maghrib</label><input type="text" id="maghrib" placeholder="18:00"></div>
        <div class="form-group"><label>Imam Maghrib</label><input type="text" id="imam_maghrib" placeholder="Ustadz..."></div>

        <div class="form-group"><label>Isya</label><input type="text" id="isya" placeholder="19:10"></div>
        <div class="form-group"><label>Imam Isya</label><input type="text" id="imam_isya" placeholder="Ustadz..."></div>
    </div>

    <div class="form-group">
        <label>Info & Pengumuman</label>
        <textarea id="info_text" placeholder="Kajian rutin ba'da maghrib..."></textarea>
    </div>

    <div class="form-group">
        <label>Kas Masjid</label>
        <input type="text" id="kas_masjid" placeholder="Rp 10.000.000">
    </div>

    <button onclick="simpanJadwal()" style="background: #28a745; color: white;">SIMPAN JADWAL & INFO</button>
    <div class="status" id="status-jadwal">✅ Berhasil disimpan!</div>
</div>

<script>
    // --- SETTING FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyC4CQMl5l1n1voweOgQouMD1kJcpHs-esU",
        databaseURL: "https://gps-tracher-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('masjid');

    // Fungsi untuk memuat data yang sudah tersimpan ke form HP
    dbRef.once('value').then((snapshot) => {
        const data = snapshot.val();
        if(data) {
            document.getElementById('nama_masjid').value = data.nama_masjid || '';
            document.getElementById('background_url').value = data.background_url || '';
            document.getElementById('running_text').value = data.running_text || '';
            
            document.getElementById('subuh').value = data.subuh || '';
            document.getElementById('imam_subuh').value = data.imam_subuh || '';
            document.getElementById('dzuhur').value = data.dzuhur || '';
            document.getElementById('imam_dzuhur').value = data.imam_dzuhur || '';
            document.getElementById('ashar').value = data.ashar || '';
            document.getElementById('imam_ashar').value = data.imam_ashar || '';
            document.getElementById('maghrib').value = data.maghrib || '';
            document.getElementById('imam_maghrib').value = data.imam_maghrib || '';
            document.getElementById('isya').value = data.isya || '';
            document.getElementById('imam_isya').value = data.imam_isya || '';
            document.getElementById('info_text').value = data.info_text || '';
            document.getElementById('kas_masjid').value = data.kas_masjid || '';
        }
    });

    // Fungsi Simpan Teks & Wallpaper
    function simpanUtama() {
        dbRef.update({
            nama_masjid: document.getElementById('nama_masjid').value,
            background_url: document.getElementById('background_url').value,
            running_text: document.getElementById('running_text').value
        }).then(() => {
            const status = document.getElementById('status-utama');
            status.style.display = 'block';
            setTimeout(() => status.style.display = 'none', 3000);
        });
    }

    // Fungsi Simpan Jadwal & Kas
    function simpanJadwal() {
        dbRef.update({
            subuh: document.getElementById('subuh').value,
            imam_subuh: document.getElementById('imam_subuh').value,
            dzuhur: document.getElementById('dzuhur').value,
            imam_dzuhur: document.getElementById('imam_dzuhur').value,
            ashar: document.getElementById('ashar').value,
            imam_ashar: document.getElementById('imam_ashar').value,
            maghrib: document.getElementById('maghrib').value,
            imam_maghrib: document.getElementById('imam_maghrib').value,
            isya: document.getElementById('isya').value,
            imam_isya: document.getElementById('imam_isya').value,
            info_text: document.getElementById('info_text').value,
            kas_masjid: document.getElementById('kas_masjid').value
        }).then(() => {
            const status = document.getElementById('status-jadwal');
            status.style.display = 'block';
            setTimeout(() => status.style.display = 'none', 3000);
        });
    }
</script>
</body>
</html>
