<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Kontrol Masjid</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0a0a2a; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
        input[type="text"], textarea, input[type="url"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        textarea { resize: vertical; min-height: 80px; }
        button { width: 100%; padding: 15px; background: #ffc107; color: black; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #e0a800; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .status { text-align: center; margin-top: 15px; font-weight: bold; color: #28a745; display: none; }
        hr { border: 0; border-top: 1px solid #eee; margin: 25px 0; }
        .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .color-item { display: flex; flex-direction: column; }
        input[type="color"] { width: 100%; height: 45px; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; padding: 2px; background: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚙️ PANEL KONTROL INFO MASJID</h2>
    
    <div class="form-group">
        <label>Nama Masjid</label>
        <input type="text" id="nama_masjid" placeholder="Masjid Al-Hikmah">
    </div>
    <div class="form-group">
        <label>Link Foto Wallpaper</label>
        <input type="url" id="background_url" placeholder="https://example.com/foto-masjid.jpg">
    </div>
    <div class="form-group">
        <label>Teks Berjalan (Running Text)</label>
        <textarea id="running_text" placeholder="Selamat datang di masjid..."></textarea>
    </div>
    <div class="form-group">
        <label>Jadwal</label>
        <input type="text" id="title_jadwal" placeholder="JADWAL SHOLAT & IMAM">
    </div>
    <div class="form-group">
        <label>Info</label>
        <input type="text" id="title_info" placeholder="ℹ️ INFO & PENGUMUMAN">
    </div>
    <div class="form-group">
        <label>SALDO Kas</label>
        <input type="text" id="title_kas" placeholder="💰 KAS MASJID">
    </div>

    <button onclick="simpanUtama()">SIMPAN PERUBAHAN</button>
    <div class="status" id="status-utama">✅ Berhasil disimpan!</div>

    <hr>

    <h2>🎨 PENGATURAN WARNA TEKS</h2>
    <div class="color-grid">
        <div class="color-item"><label>warna Nama Masjid</label><input type="color" id="warna_judul" value="#ffc107"></div>
        <div class="color-item"><label>warna Jam Digital</label><input type="color" id="warna_jam" value="#ffffff"></div>
        <div class="color-item"><label>warna Tanggal</label><input type="color" id="warna_tanggal" value="#ffc107"></div>
        <div class="color-item"><label>warna Nama waktu</label><input type="color" id="warna_jadwal" value="#ffffff"></div>
        <div class="color-item"><label>warna Waktu Sholat</label><input type="color" id="warna_waktu" value="#00ff00"></div>
        <div class="color-item"><label>warna Nama Imam</label><input type="color" id="warna_imam" value="#00e5ff"></div>
        <div class="color-item"><label>warna Info & Pengumuman</label><input type="color" id="warna_info" value="#ffffff"></div>
        <div class="color-item"><label>warna Jadwal</label><input type="color" id="warna_title_jadwal" value="#ffc107"></div>
        <div class="color-item"><label>warna Info</label><input type="color" id="warna_title_info" value="#ffc107"></div>
        <div class="color-item"><label>warna Kas</label><input type="color" id="warna_title_kas" value="#ffc107"></div>
        <div class="color-item"><label>warna runingtex</label><input type="color" id="warna_running_text" value="#ffffff"></div>
    </div>

    <button onclick="simpanWarna()" style="background: #007bff; color: white; margin-top: 20px;">SIMPAN WARNA</button>
    <div class="status" id="status-warna">✅ Warna disimpan!</div>

    <hr>

    <h2>🕌 JADWAL SHOLAT & IMAM</h2>
    <div class="grid-2">
        <div class="form-group"><label>Imsak</label><input type="text" id="imsak" placeholder="04:20"></div>
        <div class="form-group"></div> <!-- Kosong biar rapi -->
        
        <div class="form-group"><label>Subuh</label><input type="text" id="subuh" placeholder="04:30"></div>
        <div class="form-group"><label>Imam Subuh</label><input type="text" id="imam_subuh" placeholder="Ustadz..."></div>

        <div class="form-group"><label>Syuruk</label><input type="text" id="syuruk" placeholder="05:45"></div>
        <div class="form-group"></div> <!-- Kosong biar rapi -->

        <div class="form-group"><label>Dzuhur</label><input type="text" id="dzuhur" placeholder="12:00"></div>
        <div class="form-group"><label>Imam Dzuhur</label><input type="text" id="imam_dzuhur" placeholder="Ustadz..."></div>

        <div class="form-group"><label>Ashar</label><input type="text" id="ashar" placeholder="15:15"></div>
        <div class="form-group"><label>Imam Ashar</label><input type="text" id="imam_ashar" placeholder="Ustadz..."></div>

        <div class="form-group"><label>Maghrib</label><input type="text" id="maghrib" placeholder="18:00"></div>
        <div class="form-group"><label>Imam Maghrib</label><input type="text" id="imam_maghrib" placeholder="Ustadz..."></div>

        <div class="form-group"><label>Isya</label><input type="text" id="isya" placeholder="19:10"></div>
        <div class="form-group"><label>Imam Isya</label><input type="text" id="imam_isya" placeholder="Ustadz..."></div>
    </div>

    <div class="form-group">
        <label>Info & Pengumuman</label>
        <textarea id="info_text" placeholder="Kajian rutin ba'da maghrib..."></textarea>
    </div>
    <div class="form-group">
        <label>Kas Masjid</label>
        <input type="text" id="kas_masjid" placeholder="Rp 10.000.000">
    </div>

    <button onclick="simpanJadwal()" style="background: #28a745; color: white;">SIMPAN JADWAL & INFO</button>
    <div class="status" id="status-jadwal">✅ Berhasil disimpan!</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC4CQMl5l1n1voweOgQouMD1kJcpHs-esU",
        databaseURL: "https://gps-tracher-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('masjid');

    dbRef.once('value').then((snapshot) => {
        const data = snapshot.val();
        if(data) {
            document.getElementById('nama_masjid').value = data.nama_masjid || '';
            document.getElementById('background_url').value = data.background_url || '';
            document.getElementById('running_text').value = data.running_text || '';
            
            document.getElementById('title_jadwal').value = data.title_jadwal || '';
            document.getElementById('title_info').value = data.title_info || '';
            document.getElementById('title_kas').value = data.title_kas || '';

            document.getElementById('warna_judul').value = data.warna_judul || '#ffc107';
            document.getElementById('warna_jam').value = data.warna_jam || '#ffffff';
            document.getElementById('warna_tanggal').value = data.warna_tanggal || '#ffc107';
            document.getElementById('warna_jadwal').value = data.warna_jadwal || '#ffffff';
            document.getElementById('warna_waktu').value = data.warna_waktu || '#00ff00';
            document.getElementById('warna_imam').value = data.warna_imam || '#00e5ff';
            document.getElementById('warna_info').value = data.warna_info || '#ffffff';
            document.getElementById('warna_title_jadwal').value = data.warna_title_jadwal || '#ffc107';
            document.getElementById('warna_title_info').value = data.warna_title_info || '#ffc107';
            document.getElementById('warna_title_kas').value = data.warna_title_kas || '#ffc107';
            document.getElementById('warna_running_text').value = data.warna_running_text || '#ffffff';

            document.getElementById('imsak').value = data.imsak || '';
            document.getElementById('subuh').value = data.subuh || '';
            document.getElementById('syuruk').value = data.syuruk || '';
            document.getElementById('dzuhur').value = data.dzuhur || '';
            document.getElementById('imam_subuh').value = data.imam_subuh || '';
            document.getElementById('ashar').value = data.ashar || '';
            document.getElementById('imam_dzuhur').value = data.imam_dzuhur || '';
            document.getElementById('maghrib').value = data.maghrib || '';
            document.getElementById('imam_ashar').value = data.imam_ashar || '';
            document.getElementById('isya').value = data.isya || '';
            document.getElementById('imam_maghrib').value = data.imam_maghrib || '';
            document.getElementById('imam_isya').value = data.imam_isya || '';
            
            document.getElementById('info_text').value = data.info_text || '';
            document.getElementById('kas_masjid').value = data.kas_masjid || '';
        }
    });

    function simpanUtama() {
        dbRef.update({
            nama_masjid: document.getElementById('nama_masjid').value,
            background_url: document.getElementById('background_url').value,
            running_text: document.getElementById('running_text').value,
            title_jadwal: document.getElementById('title_jadwal').value,
            title_info: document.getElementById('title_info').value,
            title_kas: document.getElementById('title_kas').value
        }).then(() => {
            const status = document.getElementById('status-utama');
            status.style.display = 'block';
            setTimeout(() => status.style.display = 'none', 3000);
        });
    }

    function simpanWarna() {
        dbRef.update({
            warna_judul: document.getElementById('warna_judul').value,
            warna_jam: document.getElementById('warna_jam').value,
            warna_tanggal: document.getElementById('warna_tanggal').value,
            warna_jadwal: document.getElementById('warna_jadwal').value,
            warna_waktu: document.getElementById('warna_waktu').value,
            warna_imam: document.getElementById('warna_imam').value,
            warna_info: document.getElementById('warna_info').value,
            warna_title_jadwal: document.getElementById('warna_title_jadwal').value,
            warna_title_info: document.getElementById('warna_title_info').value,
            warna_title_kas: document.getElementById('warna_title_kas').value,
            warna_running_text: document.getElementById('warna_running_text').value
        }).then(() => {
            const status = document.getElementById('status-warna');
            status.style.display = 'block';
            setTimeout(() => status.style.display = 'none', 3000);
        });
    }

    function simpanJadwal() {
        dbRef.update({
            imsak: document.getElementById('imsak').value,
            subuh: document.getElementById('subuh').value,
            syuruk: document.getElementById('syuruk').value,
            dzuhur: document.getElementById('dzuhur').value,
            imam_subuh: document.getElementById('imam_subuh').value,
            ashar: document.getElementById('ashar').value,
            imam_dzuhur: document.getElementById('imam_dzuhur').value,
            maghrib: document.getElementById('maghrib').value,
            imam_ashar: document.getElementById('imam_ashar').value,
            isya: document.getElementById('isya').value,
            imam_maghrib: document.getElementById('imam_maghrib').value,
            imam_isya: document.getElementById('imam_isya').value,
            info_text: document.getElementById('info_text').value,
            kas_masjid: document.getElementById('kas_masjid').value
        }).then(() => {
            const status = document.getElementById('status-jadwal');
            status.style.display = 'block';
            setTimeout(() => status.style.display = 'none', 3000);
        });
    }
</script>
</body>
</html>
